# =========================================================================
# SonarQube / SonarCloud Project Configuration
# =========================================================================

sonar.projectKey=aptispace-lms
sonar.projectName=Aptispace LMS
sonar.projectVersion=1.0.0

# Source & Test Inclusions
sonar.sources=app
sonar.tests=app,test
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,test/**/*

# Exclusions
sonar.exclusions=**/node_modules/**,**/build/**,**/.react-router/**,**/storybook-static/**,**/.wireit/**,**/.agents/**,public/**,drizzle/migrations/**,**/*.stories.{ts,tsx},stories/**
sonar.coverage.exclusions=**/*.test.{ts,tsx},**/*.spec.{ts,tsx},test/**,**/*.stories.{ts,tsx},stories/**,app/tokens/**,app/db/seed.ts,scripts/**

# TypeScript & Test Coverage
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Source file encoding
sonar.sourceEncoding=UTF-8
